<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sử dụng ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Sử dụng Class Selector -->
    <p class="description">
        Xin chào! Tôi là học viên tại CodeGym. Tôi yêu thích lập trình web, thiết kế giao diện và luôn tìm tòi những
        công nghệ mới.
    </p>

    <h2>Sở thích của tôi</h2>

    <!-- Danh sách sở thích sử dụng Class và Pseudo-class :nth-child -->
    <ul class="hobby-list">
        <li class="hobby-item">Đọc sách công nghệ</li>
        <li class="hobby-item">Chơi cầu lông</li>
        <li class="hobby-item">Viết code HTML/CSS</li>
    </ul>

    <!-- Nút bấm sử dụng Pseudo-class :hover -->
    <div class="action-box">
        <button class="custom-btn">Nhấn vào đây</button>
    </div>

</body>

</html>
